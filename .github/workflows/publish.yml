name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  # Release の作成に write が要る（publish 自体は NPM_TOKEN で認証する）
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - run: corepack enable
      - run: corepack prepare yarn@4.12.0 --activate
      - run: yarn install --immutable

      - run: yarn build

      # Yarn 4 は npm の .npmrc を読まないため、setup-node の registry-url ではなく
      # YARN_NPM_AUTH_TOKEN で認証する
      - run: yarn npm publish
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # タグを push しただけでは Release は作られないので、publish が通った後に作る。
      # ノートは --generate-notes に任せる（前の Release 以降のコミットを GitHub が並べる）。
      # gh は ubuntu-latest に同梱（→ docs/SPEC.md D-16）
      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}