name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          scope: "@robustive"
          package-manager-cache: false

      - run: corepack enable
      - run: corepack prepare yarn@4.12.0 --activate
      - run: yarn install --immutable

      - run: yarn workspaces foreach --all -pt --no-private run build

      # -t は workspace 間の依存順を保つため（現在の公開対象は core のみ）
      - run: yarn workspaces foreach --all -t --no-private npm publish